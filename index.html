<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="header-content">
                <h1 class="app-title">✓ My Tasks</h1>
                <p class="app-subtitle">Organize your day, one task at a time</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="app-main">
            <!-- Sidebar -->
            <aside class="app-sidebar">
                <nav class="nav-menu">
                    <h3 class="nav-title">Views</h3>
                    <button class="nav-item active" data-view="all">
                        <span class="nav-icon">📋</span>
                        <span class="nav-label">All Tasks</span>
                        <span class="nav-count" id="countAll">0</span>
                    </button>
                    <button class="nav-item" data-view="active">
                        <span class="nav-icon">⚡</span>
                        <span class="nav-label">Active</span>
                        <span class="nav-count" id="countActive">0</span>
                    </button>
                    <button class="nav-item" data-view="completed">
                        <span class="nav-icon">✓</span>
                        <span class="nav-label">Completed</span>
                        <span class="nav-count" id="countCompleted">0</span>
                    </button>
                    <button class="nav-item" data-view="today">
                        <span class="nav-icon">📅</span>
                        <span class="nav-label">Today</span>
                        <span class="nav-count" id="countToday">0</span>
                    </button>
                </nav>

                <div class="sidebar-divider"></div>

                <nav class="categories-menu">
                    <h3 class="nav-title">Categories</h3>
                    <div class="categories-list" id="categoriesList">
                        <!-- Categories will be populated here -->
                    </div>
                </nav>

                <div class="sidebar-divider"></div>

                <div class="sidebar-actions">
                    <button class="btn-secondary" id="clearCompleted">
                        <span>🗑️</span> Clear Completed
                    </button>
                    <button class="btn-secondary" id="exportBtn">
                        <span>⬇️</span> Export Tasks
                    </button>
                    <button class="btn-secondary" id="importBtn">
                        <span>⬆️</span> Import Tasks
                    </button>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="app-content">
                <!-- Input Section -->
                <section class="input-section">
                    <div class="input-container">
                        <input 
                            type="text" 
                            id="taskInput" 
                            class="task-input" 
                            placeholder="Add a new task..."
                            autocomplete="off"
                        >
                        <button class="btn-add" id="addBtn" title="Add task (Enter or Click)">
                            <span>➕</span> Add
                        </button>
                    </div>

                    <!-- Advanced Options -->
                    <div class="advanced-options">
                        <div class="option-group">
                            <label for="categorySelect">Category:</label>
                            <select id="categorySelect" class="select-input">
                                <option value="work">Work</option>
                                <option value="personal">Personal</option>
                                <option value="shopping">Shopping</option>
                                <option value="health">Health</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="option-group">
                            <label for="prioritySelect">Priority:</label>
                            <select id="prioritySelect" class="select-input">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>

                        <div class="option-group">
                            <label for="dueDateInput">Due Date:</label>
                            <input type="date" id="dueDateInput" class="date-input">
                        </div>

                        <button class="btn-secondary" id="toggleOptionsBtn">
                            <span>⚙️</span> More Options
                        </button>
                    </div>
                </section>

                <!-- Stats Section -->
                <section class="stats-section">
                    <div class="stat-item">
                        <div class="stat-number" id="statTotal">0</div>
                        <div class="stat-label">Total Tasks</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="statActive">0</div>
                        <div class="stat-label">Active</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="statCompleted">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="statProgress">0%</div>
                        <div class="stat-label">Progress</div>
                    </div>
                </section>

                <!-- Filters and Sorting -->
                <section class="filters-section">
                    <div class="filter-group">
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="search-input" 
                            placeholder="🔍 Search tasks..."
                            autocomplete="off"
                        >
                        <select id="sortSelect" class="select-input">
                            <option value="date-desc">Newest First</option>
                            <option value="date-asc">Oldest First</option>
                            <option value="priority">Priority</option>
                            <option value="alphabetical">A-Z</option>
                            <option value="due-date">Due Date</option>
                        </select>
                        <select id="filterPriority" class="select-input">
                            <option value="">All Priorities</option>
                            <option value="high">High Priority</option>
                            <option value="medium">Medium Priority</option>
                            <option value="low">Low Priority</option>
                        </select>
                    </div>
                </section>

                <!-- Task List -->
                <section class="tasks-section">
                    <div class="tasks-container" id="tasksContainer">
                        <!-- Tasks will be rendered here -->
                    </div>

                    <!-- Empty State -->
                    <div class="empty-state" id="emptyState">
                        <div class="empty-icon">📝</div>
                        <h3>No tasks yet</h3>
                        <p>Create your first task to get started!</p>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Hidden import input -->
    <input type="file" id="importFile" accept=".json" style="display: none;">

    <!-- Script -->
    <script src="app.js"></script>
</body>
</html>
